name: screening-platform-local

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-screening_platform}
      POSTGRES_USER: ${POSTGRES_USER:-screening_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    image: screening-support-backend:local
    build:
      context: ./backend
      target: ${BACKEND_BUILD_TARGET:-development}
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://screening_local:local-development-only@postgres:5432/screening_platform}
      PROJECT_CONFIG_DIR: ${PROJECT_CONFIG_DIR:-/workspace/backend/config/projects}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-mock}
      RUN_DATABASE_TESTS: "1"
    command: ["sh", "scripts/start-local.sh"]
    working_dir: /workspace/backend
    volumes:
      - ./backend:/workspace/backend
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: development
    command: npm run dev -- --host 0.0.0.0
    working_dir: /workspace/frontend
    volumes:
      - ./frontend:/workspace/frontend
      - frontend_node_modules:/workspace/frontend/node_modules
    expose:
      - "5173"
    restart: unless-stopped

  outbox-worker:
    image: screening-support-backend:local
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://screening_local:local-development-only@postgres:5432/screening_platform}
      PROJECT_CONFIG_DIR: ${PROJECT_CONFIG_DIR:-/workspace/backend/config/projects}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-mock}
    command: ["python", "-m", "app.commands.run_outbox_worker"]
    working_dir: /workspace/backend
    volumes:
      - ./backend:/workspace/backend
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    volumes:
      - ./infrastructure/caddy/Caddyfile.local:/etc/caddy/Caddyfile:ro
    ports:
      - "8080:80"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  frontend_node_modules:
