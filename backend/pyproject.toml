[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "screening-support-backend"
version = "0.1.0"
description = "Shared backend foundation for the ONCODIR and ONCOSCREEN support projects"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "argon2-cffi>=23.1,<26",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pgvector>=0.3,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
]
embeddings = [
    "sentence-transformers>=3.3,<6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
pythonpath = ["src"]
testpaths = ["tests"]
